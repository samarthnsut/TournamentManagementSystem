server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: tournament-management-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tms}
    username: ${DB_USERNAME:tms}
    password: ${DB_PASSWORD:tms}
    hikari:
      # Serverless Postgres (Neon and friends) suspends its compute after a few idle minutes and
      # drops the connections with it. Hikari would keep handing those dead sockets out, so cap the
      # lifetime below the suspend window and let the pool drain to nothing when idle.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:60000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:240000}
      # Waking a suspended compute costs a few seconds on the first request after a quiet spell.
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # Spring's mail indicator opens an SMTP connection on every health check, so an unreachable or
    # merely slow mail host drags /actuator/health to DOWN — and a platform that restarts on a
    # failing health check would then kill a service whose only fault is that invites are queued.
    # Undeliverable mail is not a liveness condition; app.mail.enabled already governs whether we
    # send at all.
    mail:
      enabled: false

app:
  mail:
    # Off by default so a missing SMTP server can never be the reason an invite fails. When off,
    # the message is logged instead — which is what the roadmap's "logged link" meant.
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:no-reply@tekspo-infinity.local}
    # Where the links in emails point. Must include the basePath the SPA is served under.
    base-url: ${APP_BASE_URL:http://localhost:3000/TournamentManagementSystem}
  storage:
    bucket: ${S3_BUCKET:tms-docs}
    # Blank against real S3; set locally and in tests to the MinIO address.
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:ap-south-1}
    access-key: ${S3_ACCESS_KEY:minio}
    secret-key: ${S3_SECRET_KEY:minio123}
    # 10 MiB, per 08 section 14.1.
    max-size-bytes: ${S3_MAX_SIZE_BYTES:10485760}
    allowed-mime-types: application/pdf,image/jpeg,image/png
    upload-url-ttl-seconds: 900
    download-url-ttl-seconds: 300
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:3000,http://localhost:3001}
  jwt:
    secret: ${JWT_SECRET:change-this-local-development-secret-before-production}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}
