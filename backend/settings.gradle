pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

// Downloads the Java 21 toolchain when the machine doesn't already have one, so a fresh clone
// builds without a manual JDK install.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'tournament-management-backend'

