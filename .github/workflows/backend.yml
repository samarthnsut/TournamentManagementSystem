name: Backend CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  build:
    name: Build and test
    # ubuntu-latest ships a running Docker daemon, which Testcontainers needs.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The extensibility promise in ARCHITECTURE_BRIEF section 7 is that adding a sport is one
      # strategy class, never a branch. A conditional on the sport is how that decays, and it decays
      # quietly — one "just this once" at a time — so it is checked mechanically rather than in
      # review. Sport names are legitimate in migrations, seeds and test fixtures; only main source
      # is scanned. See 10_DEVELOPMENT_ROADMAP risk R4.
      - name: Reject sport conditionals
        run: |
          set -euo pipefail
          if grep -rnE --include='*.java' \
              -e '"(FOOTBALL|ATHLETICS[A-Z_0-9]*|CHESS|CRICKET|BASKETBALL|HOCKEY|KABADDI|BADMINTON|VOLLEYBALL)"' \
              -e '(sport|sportCode|sportName)[[:space:]]*(==|!=)' \
              -e '(sport|sportCode|sportName)[[:space:]]*\.(equals|equalsIgnoreCase|contains|startsWith)[[:space:]]*\(' \
              -e 'switch[[:space:]]*\([[:space:]]*[a-zA-Z]*[sS]port' \
              src/main/java; then
            echo
            echo "::error::Sport-specific branching found in backend/src/main/java."
            echo "Dispatch through FixtureGeneratorFactory / ResultEvaluatorFactory /"
            echo "LeaderboardStrategyFactory instead, or move the value into config.rules."
            exit 1
          fi
          echo "No sport conditionals in main source."

      - name: Build and run tests
        run: ./gradlew build --no-daemon --stacktrace

      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: backend/build/test-results/test/TEST-*.xml
          check_name: Backend test results

      - name: Upload reports on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: backend/build/reports/
          retention-days: 7
